<title>Street Corner Test</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* One painted screen, played full-bleed. The world is a 320-pixel-wide canvas scaled up with hard edges; the HUD hugs the corners. */
:root{
  --ink:#1b1622; --slate:#2b2735; --slate2:#3a3448; --gold:#ffc93c; --green:#4fbf5a; --orange:#ff8a3d; --pink:#ff5ca8; --cream:#fff4dc;
  --px:'Press Start 2P', ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--cream);overflow:hidden}
body{font-family:var(--px);-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink)}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;display:block;max-width:100%;max-height:100%}
.hud{position:fixed;pointer-events:none;display:flex;gap:6px}
#chips{top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px))}
.chip{background:var(--slate);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:6px 8px;font-size:11px;border-radius:6px;display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;display:inline-block;border:2px solid var(--ink);border-radius:2px}
#buzz{top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));flex-direction:column;align-items:flex-end}
.bar{width:92px;height:12px;background:var(--slate);border:3px solid var(--ink);border-radius:4px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
#acts{right:max(10px,env(safe-area-inset-right,0px));left:max(10px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));flex-direction:row;flex-wrap:wrap-reverse;justify-content:flex-end;pointer-events:auto}
.btn{font-family:var(--px);font-size:11px;color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:12px 14px;min-height:48px;min-width:48px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.drink{background:var(--orange)}
.btn.act{background:var(--green)}
.btn.dance{background:var(--pink)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#say{left:50%;transform:translateX(-50%);top:calc(54px + env(safe-area-inset-top,0px));max-width:min(86vw,360px);text-align:center}
#say span{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:8px 10px;font-size:10px;line-height:1.6;box-shadow:0 3px 0 var(--ink)}
#hint{left:max(10px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));font-size:9px;opacity:.85;max-width:52vw;line-height:1.7;text-shadow:2px 2px 0 var(--ink)}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
</style>

<div id="wrap"><canvas id="cv" width="320" height="569" aria-label="The street corner. Tap to walk."></canvas></div>
<div class="hud" id="chips"><div class="chip"><i style="background:var(--gold)"></i><span id="money">$0</span></div><div class="chip"><i style="background:#7fd18a"></i><span id="bottles">0</span></div></div>
<div class="hud" id="buzz"><div class="bar" title="Buzz"><b id="buzzFill"></b></div></div>
<div class="hud" id="say" hidden><span id="sayText"></span></div>
<div class="hud" id="hint">Tap to walk. Grab bottles, recycle them, buy a beer.</div>
<div class="hud" id="acts"></div>

<script>
const W = 640, H = 1138;           // backdrop space
const CW = 320, CH = 569;          // the pixel canvas (locked 320 columns)
const SOBER_SAT = 0.45;            // locked
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = CW; off.height = CH; const o = off.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const IMG = {};
const names = ['bg-sober.jpg','bg-drunk.jpg','walk1.png','walk2.png','beg.png','pickup.png','sit.png','cart.png','bench.png','recycle.png','bottle.png','coin.png'];
let loaded = 0;
names.forEach(n => { const i = new Image(); i.onload = () => { if (++loaded === names.length) start(); }; i.onerror = () => { loaded++; }; i.src = 'img/' + n; IMG[n.split('.')[0]] = i; });

// walkable pavement (backdrop space)
const WALK = [[0,600],[178,618],[311,706],[613,804],[640,812],[640,1138],[400,1138],[0,752]];
function inside(x,y){ let c=false; for(let i=0,j=WALK.length-1;i<WALK.length;j=i++){ const [xi,yi]=WALK[i],[xj,yj]=WALK[j]; if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; }
function clampWalk(x,y){ if(inside(x,y)) return [x,y]; // pull toward the middle of the pavement
  let cx=430, cy=900; for(let t=0;t<1;t+=.04){ const px=x+(cx-x)*t, py=y+(cy-y)*t; if(inside(px,py)) return [px,py]; } return [cx,cy]; }

// world things (bottom-centre anchors, backdrop space)
const PROPS = [
  { img:'bench', x:291, y:897, w:206, kind:'bench' },
  { img:'cart', x:428, y:950, w:212, kind:'cart' },
  { img:'recycle', x:575, y:876, w:62, kind:'recycle' },
];
const STORE = { x:470, y:840, kind:'store' };       // the liquor store door
let bottlesOnGround = [ {x:120,y:780}, {x:250,y:1040}, {x:600,y:1010} ];

const st = { x:520, y:1000, tx:null, ty:null, face:1, money:0, bottles:0, beers:0, buzz:0, pose:'idle', poseT:0, t:0, walkT:0, sit:false, drunkMix:0, coins:[] };

function hScale(y){ return 0.62 + 0.38*Math.min(1,Math.max(0,(y-600)/(950-600))); } // smaller further up the pavement
const HERO_H = 176; // hero height at the front, backdrop px (matches the painted man)

function say(t){ const s=document.getElementById('say'); document.getElementById('sayText').textContent=t; s.hidden=false; clearTimeout(say.k); say.k=setTimeout(()=>s.hidden=true,2400); }

function near(a, r){ return Math.hypot(st.x-a.x, st.y-a.y) < r; }

function buttons(){
  const acts=document.getElementById('acts'); acts.innerHTML='';
  const add=(label,cls,fn)=>{ const b=document.createElement('button'); b.className='btn '+cls; b.type='button'; b.textContent=label; b.onclick=e=>{e.stopPropagation(); fn(); buttons();}; acts.appendChild(b); };
  const wasted = st.buzz >= 22;
  if (near(PROPS[2],90) && st.bottles>0) add('Recycle','act',()=>{ st.money+=st.bottles; say('+$'+st.bottles+'. Ka-ching.'); st.bottles=0; });
  if (near(STORE,110)) add('Buy beer $3','act',()=>{ if(st.money>=3){ st.money-=3; st.beers++; say('One cold one. For later. Maybe.'); } else say('Three bucks. You have '+st.money+'.'); });
  if (near(PROPS[1],120)) add('Hot dog $2','act',()=>{ if(st.money>=2){ st.money-=2; say('Best hot dog in Boston. Allegedly.'); } else say('Smells amazing. Costs two bucks.'); });
  if (near(PROPS[0],120) && !st.sit) add('Sit','act',()=>{ st.sit=true; st.x=PROPS[0].x; st.y=PROPS[0].y-4; st.tx=null; say(wasted?'The bench is spinning. Lovely.':'A bench. A man. A moment.'); });
  if (wasted) add('Dance','dance',()=>{ st.pose='dance'; st.poseT=2.4; st.sit=false; say(['Nobody asked. He danced anyway.','The pigeons approve.','Moves you can\'t teach.'][Math.floor(Math.random()*3)]); });
  if (st.beers>0) add('Drink ('+st.beers+')','drink',()=>{ st.beers--; st.buzz=Math.min(100,st.buzz+38); st.pose='swig'; st.poseT=1; say(st.buzz>40?'Oh. Oh yes.':'Here we go.'); });
  document.getElementById('money').textContent='$'+st.money;
  document.getElementById('bottles').textContent=st.bottles;
  document.getElementById('hint').hidden = st.money>0 || st.beers>0 || st.buzz>0;
}

function toWorld(ev){ const r=cv.getBoundingClientRect(); return [ (ev.clientX-r.left)/r.width*W, (ev.clientY-r.top)/r.height*H ]; }
cv.addEventListener('pointerdown', ev => { const [x,y]=toWorld(ev); const [cx,cy]=clampWalk(x,y); st.tx=cx; st.ty=cy; st.sit=false; });
const keys={}; addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;}); addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function fit(){ const s=Math.min(innerWidth/CW, innerHeight/CH); cv.style.width=Math.floor(CW*s)+'px'; cv.style.height=Math.floor(CH*s)+'px'; }
addEventListener('resize',fit);

function drawSprite(img, x, y, h, flip, tint){
  if(!img || !img.width) return;
  const s = h/img.height, w = img.width*s;
  o.save(); o.translate(Math.round(x/2), Math.round(y/2)); if(flip<0) o.scale(-1,1);
  o.drawImage(img, Math.round(-w/4), Math.round(-h/2), Math.round(w/2), Math.round(h/2));
  o.restore();
}

let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0); last=ts; st.t+=dt;
  const drunk = Math.min(1, st.buzz/40);
  st.drunkMix += (drunk - st.drunkMix) * Math.min(1, dt*1.4);   // about 2 s blend
  const wasted = st.buzz>=22;

  // input: keys or tap target
  let mx=0,my=0; if(keys['arrowleft']||keys['a'])mx--; if(keys['arrowright']||keys['d'])mx++; if(keys['arrowup']||keys['w'])my--; if(keys['arrowdown']||keys['s'])my++;
  if(mx||my){ st.tx=st.x+mx*40; st.ty=st.y+my*40; st.sit=false; }
  let moving=false;
  if(st.tx!=null && !st.sit && st.pose!=='swig'){
    const dx=st.tx-st.x, dy=st.ty-st.y, d=Math.hypot(dx,dy);
    const sp = (wasted? 120:150)*hScale(st.y);
    if(d<4){ st.tx=null; } else {
      let nx=st.x+dx/d*sp*dt, ny=st.y+dy/d*sp*dt;
      if(wasted){ nx += Math.sin(st.t*3.1)*22*dt*st.drunkMix; ny += Math.cos(st.t*2.3)*10*dt*st.drunkMix; }
      [nx,ny]=clampWalk(nx,ny); st.x=nx; st.y=ny; moving=true; if(Math.abs(dx)>2) st.face=dx>0?1:-1;
    }
  }
  if(moving) st.walkT+=dt;
  // pick up bottles
  bottlesOnGround = bottlesOnGround.filter(b=>{ if(Math.hypot(b.x-st.x,b.y-st.y)<46){ st.bottles++; st.pose='pickup'; st.poseT=.45; say(st.bottles===1?'A bottle! Five cents of hope.':'Another one.'); buttons(); return false; } return true; });
  if(st.poseT>0){ st.poseT-=dt; if(st.poseT<=0) st.pose='idle'; }
  if(st.buzz>0){ const before=st.buzz>=22; st.buzz=Math.max(0,st.buzz-dt*0.9); if(before && st.buzz<22){ say('Sobering up. Ugh. The light is so... normal.'); } }
  if(Math.floor(st.t*4)!==Math.floor((st.t-dt)*4)) buttons();

  // ---- draw to the 320 canvas ----
  o.imageSmoothingEnabled = true; o.imageSmoothingQuality='high';
  // drunk camera: slight push-in on him + slow sway (no shake)
  const z = 1 + .14*st.drunkMix, rot = reduce?0: Math.sin(st.t*.6)*.025*st.drunkMix;
  o.setTransform(1,0,0,1,0,0); o.clearRect(0,0,CW,CH);
  o.save();
  const fx=st.x/2, fy=(st.y-90)/2;
  o.translate(CW/2,CH/2); o.rotate(rot); o.scale(z,z); o.translate(-CW/2 - (fx-CW/2)*(z-1)/z, -CH/2 - (fy-CH/2)*(z-1)/z);
  o.translate(0,0);
  o.drawImage(IMG['bg-sober'],0,0,CW,CH);
  if(st.drunkMix>.01){ o.globalAlpha=st.drunkMix; o.drawImage(IMG['bg-drunk'],0,0,CW,CH); o.globalAlpha=1; }

  // y-sorted things
  const things = [];
  PROPS.forEach(p=>things.push({y:p.y, draw:()=>{ const img=IMG[p.img]; const h=p.w*img.height/img.width; o.save(); if(st.drunkMix>.05) o.filter=`brightness(${1-.42*st.drunkMix}) sepia(${.35*st.drunkMix}) saturate(${1+.4*st.drunkMix})`; drawSprite(img,p.x,p.y,h,1); o.restore(); }}));
  bottlesOnGround.forEach(b=>things.push({y:b.y, draw:()=>{ const bob=Math.sin(st.t*3+b.x)*4; drawSprite(IMG.bottle,b.x,b.y-14+bob,46,1); drawSprite(IMG.coin,b.x,b.y-58+bob,22,1); }}));
  things.push({y:st.y, draw:()=>{
    const s=hScale(st.y), h=HERO_H*s;
    // soft shadow
    o.fillStyle=`rgba(20,10,30,${.28+.1*st.drunkMix})`; o.beginPath(); o.ellipse(Math.round(st.x/2),Math.round(st.y/2),Math.round(h*.14),Math.round(h*.04),0,0,7); o.fill();
    let img=IMG.beg, hh=h, lean=0, by=0;
    if(st.sit){ img=IMG.sit; hh=h*.66; }
    else if(st.pose==='pickup'){ img=IMG.pickup; hh=h*.9; }
    else if(st.pose==='swig'){ img=IMG.beg; }
    else if(st.pose==='dance'){ img=(Math.floor(st.t*6)%2)?IMG.walk1:IMG.walk2; by=-Math.abs(Math.sin(st.t*9))*14; }
    else if(moving){ img=(Math.floor(st.walkT*6)%2)?IMG.walk1:IMG.walk2; by=-Math.abs(Math.sin(st.walkT*12))*3; }
    const flip = st.pose==='dance' ? (Math.floor(st.t*3)%2?1:-1) : st.face;
    o.save(); if(wasted){ o.translate(Math.round(st.x/2),Math.round(st.y/2)); o.rotate(Math.sin(st.t*2.2)*.08*st.drunkMix); o.translate(-Math.round(st.x/2),-Math.round(st.y/2)); }
    if(st.drunkMix>.05) o.filter=`brightness(${1-.3*st.drunkMix}) sepia(${.25*st.drunkMix})`;
    drawSprite(img, st.x, st.y+by, hh, flip);
    o.restore();
  }});
  things.sort((a,b)=>a.y-b.y).forEach(t=>t.draw());
  o.restore();

  // final: one pixel grid, sober saturation on the whole frame
  ctx.imageSmoothingEnabled=false;
  const sat = SOBER_SAT + (1.05-SOBER_SAT)*st.drunkMix;
  ctx.filter = `saturate(${sat.toFixed(3)})`;
  ctx.drawImage(off,0,0);
  ctx.filter='none';
  document.getElementById('buzzFill').style.width = Math.min(100,st.buzz)+'%';
  requestAnimationFrame(frame);
}

function start(){ fit(); buttons(); say('Morning. Mouth like a carpet. Find some bottles.'); requestAnimationFrame(frame); }
</script>
