<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#111" />
<title>Street prototype</title>
<style>
  :root { --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #f4f0e8;
    font: 15px/1.25 -apple-system, system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; image-rendering: pixelated; }
  svg { display: block; }

  /* ---------- top HUD ---------- */
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: calc(var(--st) + 6px) calc(var(--sr) + 10px) 10px calc(var(--sl) + 10px);
    pointer-events: none; background: linear-gradient(#000b, #0006 70%, #0000); }
  #skyrow { display: flex; align-items: center; gap: 8px; }
  #dayno { font-weight: 800; font-size: 16px; min-width: 30px; text-shadow: 0 1px 2px #000; }
  #sky { position: relative; flex: 1; height: 30px; }
  #sky .track { position: absolute; left: 0; right: 0; top: 4px; bottom: 6px; border-radius: 12px; overflow: hidden;
    background: linear-gradient(90deg, #f6b26b33 0%, #87c4ff44 25%, #87c4ff44 50%, #ff8a4c55 66%, #2a2a6a88 75%, #0c0c2aaa 100%); border: 1px solid #fff2; }
  #sky .tick { position: absolute; top: 2px; bottom: 4px; width: 2px; background: #fff5; border-radius: 1px; }
  #sky .tick.end { background: #ff5a5acc; }
  #sun { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #ffd84a;
    box-shadow: 0 0 10px 3px #ffb43acc; transition: background .5s, box-shadow .5s; }
  #sun.moon { background: #dfe8ff; box-shadow: 0 0 8px 2px #9fb4ffaa; }
  #sky.late #sun { animation: pulse .9s infinite; }
  .tbtn { pointer-events: auto; width: 40px; height: 40px; border-radius: 12px; background: #fff2; border: 1.5px solid #fff4;
    display: flex; align-items: center; justify-content: center; color: #fff; }
  .tbtn:active { background: #fff5; }

  #meters { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 12px; margin-top: 7px; }
  .meter { display: flex; align-items: center; gap: 6px; }
  .meter .ic { width: 20px; height: 20px; flex: none; filter: drop-shadow(0 1px 1px #000a); }
  .meter .track { flex: 1; height: 10px; background: #0009; border-radius: 6px; overflow: hidden; border: 1px solid #fff2; }
  .meter .fill { height: 100%; width: 50%; border-radius: 6px; transition: width .25s; }
  .meter.low { animation: pulse .7s infinite; }
  .meter.low .track { border-color: #fff9; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .55; } }

  #chips { display: flex; gap: 8px; margin-top: 7px; align-items: center; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 4px; background: #0008; border: 1px solid #fff2; border-radius: 12px;
    padding: 3px 9px 3px 6px; font-weight: 700; font-size: 15px; }
  .chip svg { width: 16px; height: 16px; }
  .chip.bump { animation: bump .35s; }
  @keyframes bump { 40% { transform: scale(1.35); } }

  #toast { position: fixed; top: calc(var(--st) + 215px); left: 16px; right: 16px; text-align: center; font-size: 17px; font-weight: 600;
    pointer-events: none; text-shadow: 0 1px 3px #000, 0 0 8px #000; opacity: 0; transition: opacity .3s; }
  #toast.on { opacity: 1; }
  .float { position: fixed; pointer-events: none; font-weight: 900; font-size: 22px; text-shadow: 0 2px 0 #000, 0 0 6px #000;
    transform: translate(-50%, -50%); animation: rise 1.1s ease-out forwards; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.25); }
    100% { opacity: 0; transform: translate(-50%, -260%) scale(1); } }

  /* ---------- thumbs ---------- */
  #stick { position: fixed; left: calc(var(--sl) + 18px); bottom: calc(var(--sb) + 22px); width: 140px; height: 140px;
    border-radius: 70px; background: #ffffff18; border: 2px solid #fff4; }
  #knob { position: absolute; left: 40px; top: 40px; width: 60px; height: 60px; border-radius: 30px; background: #fff7;
    box-shadow: 0 2px 6px #0006; }
  #thumbs { position: fixed; right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 22px); display: flex; flex-direction: column;
    gap: 10px; align-items: flex-end; max-width: 58%; }
  #acts { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .act { min-height: 54px; min-width: 96px; padding: 0 18px; display: flex; align-items: center; justify-content: center;
    background: #1c1c1ccc; border: 2px solid #fff6; color: #fff; border-radius: 27px; font-size: 18px; font-weight: 800;
    box-shadow: 0 3px 0 #0008; }
  .act.first { min-height: 64px; border-radius: 32px; font-size: 20px; border-color: #fff; }
  .act.whimsy { background: linear-gradient(135deg, #ff5fb4, #a65cff); border-color: #ffd0f0; }
  .act.dim { opacity: .45; }
  .act:active, .round:active { transform: translateY(2px) scale(.96); box-shadow: none; }
  .round { width: 76px; height: 76px; border-radius: 38px; background: radial-gradient(circle at 35% 30%, #ffd27a, #d88a1a);
    border: 2px solid #fff8; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 3px 0 #0008; }
  .moveRow { display: flex; gap: 10px; }
  .round.mv { width: 64px; height: 64px; font: 800 13px system-ui; color: #3a1c08; display: flex; align-items: center; justify-content: center; }
  .round.jump { background: radial-gradient(circle at 35% 30%, #a8f0e0, #35b09a); }
  .round.mv.on { background: radial-gradient(circle at 35% 30%, #ffb0c8, #ff5c8a); }
  #stam { position: fixed; left: 50%; bottom: calc(var(--sb) + 8px); width: 120px; height: 7px; margin-left: -60px; border-radius: 4px; background: rgba(0,0,0,.35); opacity: 0; transition: opacity .3s; pointer-events: none; }
  #stamFill { height: 100%; width: 100%; border-radius: 4px; background: #ffb800; }
  .round svg { width: 36px; height: 36px; }
  .round .badge { position: absolute; top: -4px; right: -4px; min-width: 24px; height: 24px; border-radius: 12px; background: #111;
    border: 2px solid #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box; }
  .round.mix { background: radial-gradient(circle at 35% 30%, #9ff5ff, #3a7bff); }

  /* ---------- screens ---------- */
  #screen { position: fixed; inset: 0; background: #111e; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: calc(var(--st) + 24px) 24px calc(var(--sb) + 24px); gap: 12px; overflow-y: auto;
    box-sizing: border-box; }
  #screen h1 { font-size: 26px; margin: 0; }
  #screen input { font-size: 18px; padding: 10px; width: 170px; text-align: center; background: #333; color: #fff; border: 1px solid #666; border-radius: 10px; }
  #screen button { font-size: 19px; padding: 14px 26px; min-width: 220px; border-radius: 14px; border: 0; background: #f2ede2; color: #111; font-weight: 800; }
  #screen button.alt { background: #3a3a3a; color: #eee; font-size: 16px; }
  #screen button.go { background: linear-gradient(135deg, #ffd27a, #ff7aa8); }
  #book { font-size: 13px; opacity: .8; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 3s; }
  #dbg { position: fixed; left: calc(var(--sl) + 6px); bottom: calc(var(--sb) + 170px); font: 11px/1.3 ui-monospace, monospace;
    background: #000a; padding: 4px 6px; border-radius: 6px; pointer-events: none; white-space: pre; }
  /* ---------- 2b-1: goals, bubbles, begging lines, stores ---------- */
  #meters { grid-template-columns: 1fr 1fr 1fr; }
  .chip.txt { font-size: 12px; padding: 3px 8px; }
  #goals { margin-top: 6px; font-size: 12.5px; line-height: 1.35; text-shadow: 0 1px 2px #000; max-width: 70%; }
  .goal .box { display: inline-block; width: 11px; height: 11px; border: 1.5px solid #fffc; border-radius: 3px; margin-right: 6px;
    font-size: 10px; line-height: 11px; text-align: center; vertical-align: -1px; }
  .goal.done { opacity: .6; text-decoration: line-through; }
  .goal.done .box { background: #5fd07a; border-color: #5fd07a; color: #000; }
  #bubbles { position: fixed; inset: 0; pointer-events: none; }
  .bubble { position: fixed; transform: translate(-50%, -100%); max-width: 190px; padding: 6px 10px; border-radius: 12px;
    background: #fffdf4; color: #1a1a1a; font-weight: 700; font-size: 14px; line-height: 1.2; text-align: center;
    box-shadow: 0 2px 0 #0006; white-space: normal; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #fffdf4; }
  .bubble.me { background: #dff1ff; } .bubble.me::after { border-top-color: #dff1ff; }
  .bubble.give { background: #fff2a8; } .bubble.give::after { border-top-color: #fff2a8; }
  .bubble.mad { background: #ffd0d0; color: #6a0000; } .bubble.mad::after { border-top-color: #ffd0d0; }
  .act.line { min-height: 44px; font-size: 16px; padding: 0 14px; background: #20304acc; }
  .act.line.first { min-height: 50px; font-size: 17px; }
  .act.beg { background: linear-gradient(135deg, #3a6ad8, #2a9a8a); }
  .round.wine { background: radial-gradient(circle at 35% 30%, #ff9ab8, #a02050); }
  #shopPanel { position: fixed; left: 12px; right: 12px; top: calc(var(--st) + 70px); bottom: calc(var(--sb) + 20px); max-width: 440px; margin: 0 auto;
    background: #1d1a17f2; border: 2px solid #fff3; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }
  .shead { display: flex; justify-content: space-between; align-items: center; font-size: 20px; }
  .smoney { display: flex; gap: 4px; align-items: center; font-weight: 800; } .smoney svg { width: 18px; height: 18px; }
  .sgreet { opacity: .7; font-style: italic; }
  .slist { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; background: #fff1; border-radius: 12px; border: 1px solid #fff2; }
  .srow:active { background: #fff3; }
  .srow.poor { opacity: .45; }
  .sname { font-weight: 800; } .snote { font-size: 12px; opacity: .75; }
  .sbuy { font-weight: 900; font-size: 18px; color: #ffd84a; min-width: 40px; text-align: right; }
  .sclose { font-size: 18px; padding: 12px; border-radius: 12px; border: 0; background: #f2ede2; color: #111; font-weight: 800; }
  .hidden { display: none !important; }
</style>
  <script type="module" crossorigin src="./assets/index-EkI3yqjs.js"></script>
</head>
<body>
<div id="hud">
  <div id="skyrow">
    <div id="dayno">1</div>
    <div id="sky"><div class="track"></div><div class="tick" style="left:60%"></div><div class="tick end" style="left:calc(100% - 2px)"></div><div id="sun"></div></div>
    <div class="tbtn" id="centerBtn"></div>
    <div class="tbtn" id="viewBtn"></div>
    <div class="tbtn" id="pauseBtn"></div>
  </div>
  <div id="meters"></div>
  <div id="chips"></div>
  <div id="goals"></div>
</div>
<div id="bubbles"></div>
<div id="toast"></div>
<div id="stick"><div id="knob"></div></div>
<div id="thumbs"><div id="acts"></div><div class="round hidden" id="drinkBtn"></div><div class="moveRow"><div class="round mv" id="runBtn">RUN</div><div class="round mv jump" id="jumpBtn">JUMP</div></div></div>
<div id="stam"><div id="stamFill"></div></div>
<div id="dbg" class="hidden"></div>
<div id="shopPanel" class="hidden"></div>
<div id="fade"></div>
<div id="screen"></div>
</body>
</html>
