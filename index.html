<style>
  :root { --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #f4f0e8;
    font: 15px/1.25 -apple-system, system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; image-rendering: pixelated; }
  svg { display: block; }

  /* ---------- top HUD ---------- */
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: calc(var(--st) + 6px) calc(var(--sr) + 10px) 10px calc(var(--sl) + 10px);
    pointer-events: none; background: linear-gradient(#000b, #0006 70%, #0000); }
  #skyrow { display: flex; align-items: center; gap: 8px; }
  #dayno { font-weight: 800; font-size: 16px; min-width: 30px; text-shadow: 0 1px 2px #000; }
  #sky { position: relative; flex: 1; height: 30px; }
  #sky .track { position: absolute; left: 0; right: 0; top: 4px; bottom: 6px; border-radius: 12px; overflow: hidden;
    background: linear-gradient(90deg, #f6b26b33 0%, #87c4ff44 25%, #87c4ff44 50%, #ff8a4c55 66%, #2a2a6a88 75%, #0c0c2aaa 100%); border: 1px solid #fff2; }
  #sky .tick { position: absolute; top: 2px; bottom: 4px; width: 2px; background: #fff5; border-radius: 1px; }
  #sky .tick.end { background: #ff5a5acc; }
  #sun { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #ffd84a;
    box-shadow: 0 0 10px 3px #ffb43acc; transition: background .5s, box-shadow .5s; }
  #sun.moon { background: #dfe8ff; box-shadow: 0 0 8px 2px #9fb4ffaa; }
  #sky.late #sun { animation: pulse .9s infinite; }
  .tbtn { pointer-events: auto; width: 40px; height: 40px; border-radius: 12px; background: #fff2; border: 1.5px solid #fff4;
    display: flex; align-items: center; justify-content: center; color: #fff; }
  .tbtn:active { background: #fff5; }

  #meters { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 12px; margin-top: 7px; }
  .meter { display: flex; align-items: center; gap: 6px; }
  .meter .ic { width: 20px; height: 20px; flex: none; filter: drop-shadow(0 1px 1px #000a); }
  .meter .track { flex: 1; height: 10px; background: #0009; border-radius: 6px; overflow: hidden; border: 1px solid #fff2; }
  .meter .fill { height: 100%; width: 50%; border-radius: 6px; transition: width .25s; }
  .meter.low { animation: pulse .7s infinite; }
  .meter.low .track { border-color: #fff9; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .55; } }

  #chips { display: flex; gap: 8px; margin-top: 7px; align-items: center; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 4px; background: #0008; border: 1px solid #fff2; border-radius: 12px;
    padding: 3px 9px 3px 6px; font-weight: 700; font-size: 15px; }
  .chip svg { width: 16px; height: 16px; }
  .chip.bump { animation: bump .35s; }
  @keyframes bump { 40% { transform: scale(1.35); } }

  #toast { position: fixed; top: calc(var(--st) + 215px); left: 16px; right: 16px; text-align: center; font-size: 17px; font-weight: 600;
    pointer-events: none; text-shadow: 0 1px 3px #000, 0 0 8px #000; opacity: 0; transition: opacity .3s; }
  #toast.on { opacity: 1; }
  .float { position: fixed; pointer-events: none; font-weight: 900; font-size: 22px; text-shadow: 0 2px 0 #000, 0 0 6px #000;
    transform: translate(-50%, -50%); animation: rise 1.1s ease-out forwards; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.25); }
    100% { opacity: 0; transform: translate(-50%, -260%) scale(1); } }

  /* ---------- thumbs ---------- */
  #stick { position: fixed; left: calc(var(--sl) + 18px); bottom: calc(var(--sb) + 22px); width: 140px; height: 140px;
    border-radius: 70px; background: #ffffff18; border: 2px solid #fff4; }
  #knob { position: absolute; left: 40px; top: 40px; width: 60px; height: 60px; border-radius: 30px; background: #fff7;
    box-shadow: 0 2px 6px #0006; }
  #thumbs { position: fixed; right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 22px); display: flex; flex-direction: column;
    gap: 10px; align-items: flex-end; max-width: 58%; }
  #acts { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .act { min-height: 54px; min-width: 96px; padding: 0 18px; display: flex; align-items: center; justify-content: center;
    background: #1c1c1ccc; border: 2px solid #fff6; color: #fff; border-radius: 27px; font-size: 18px; font-weight: 800;
    box-shadow: 0 3px 0 #0008; }
  .act.first { min-height: 64px; border-radius: 32px; font-size: 20px; border-color: #fff; }
  .act.whimsy { background: linear-gradient(135deg, #ff5fb4, #a65cff); border-color: #ffd0f0; }
  .act.dim { opacity: .45; }
  .act:active, .round:active { transform: translateY(2px) scale(.96); box-shadow: none; }
  .round { width: 76px; height: 76px; border-radius: 38px; background: radial-gradient(circle at 35% 30%, #ffd27a, #d88a1a);
    border: 2px solid #fff8; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 3px 0 #0008; }
  .moveRow { display: flex; gap: 10px; }
  .round.mv { width: 64px; height: 64px; font: 800 13px system-ui; color: #3a1c08; display: flex; align-items: center; justify-content: center; }
  .round.jump { background: radial-gradient(circle at 35% 30%, #a8f0e0, #35b09a); }
  .round.mv.on { background: radial-gradient(circle at 35% 30%, #ffb0c8, #ff5c8a); }
  #stam { position: fixed; left: 50%; bottom: calc(var(--sb) + 8px); width: 120px; height: 7px; margin-left: -60px; border-radius: 4px; background: rgba(0,0,0,.35); opacity: 0; transition: opacity .3s; pointer-events: none; }
  #stamFill { height: 100%; width: 100%; border-radius: 4px; background: #ffb800; }
  .round svg { width: 36px; height: 36px; }
  .round .badge { position: absolute; top: -4px; right: -4px; min-width: 24px; height: 24px; border-radius: 12px; background: #111;
    border: 2px solid #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box; }
  .round.mix { background: radial-gradient(circle at 35% 30%, #9ff5ff, #3a7bff); }

  /* ---------- screens ---------- */
  #screen { position: fixed; inset: 0; background: #111e; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: calc(var(--st) + 24px) 24px calc(var(--sb) + 24px); gap: 12px; overflow-y: auto;
    box-sizing: border-box; }
  #screen h1 { font-size: 26px; margin: 0; }
  #screen input { font-size: 18px; padding: 10px; width: 170px; text-align: center; background: #333; color: #fff; border: 1px solid #666; border-radius: 10px; }
  #screen button { font-size: 19px; padding: 14px 26px; min-width: 220px; border-radius: 14px; border: 0; background: #f2ede2; color: #111; font-weight: 800; }
  #screen button.alt { background: #3a3a3a; color: #eee; font-size: 16px; }
  #screen button.go { background: linear-gradient(135deg, #ffd27a, #ff7aa8); }
  #book { font-size: 13px; opacity: .8; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 3s; z-index: 65; }
  #screen { z-index: 70; } /* Build A: the obituary and pause screens sit above the mini map and HUD bits */
  #dbg { position: fixed; left: calc(var(--sl) + 6px); bottom: calc(var(--sb) + 170px); font: 11px/1.3 ui-monospace, monospace;
    background: #000a; padding: 4px 6px; border-radius: 6px; pointer-events: none; white-space: pre; }
  /* Integration pass: a big FPS readout David can read on the phone (top right, under the sky row). */
  #fpsBig { position: fixed; right: calc(var(--sr, 0px) + 8px); top: calc(var(--st, 0px) + 64px); z-index: 40;
    font: 700 22px/1.15 ui-monospace, monospace; color: #fff; background: #000b; padding: 6px 10px; border-radius: 8px;
    pointer-events: none; white-space: pre; text-align: right; }
  #fpsBig.hidden { display: none; }
  #skipTut { position: fixed; left: calc(var(--sl) + 112px); top: calc(var(--st) + 150px); width: 44px; height: 44px; z-index: 30;
    display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; background: #0008; border-radius: 22px; }
  #skipTut.hidden { display: none; }
  @keyframes tutPulse { 0%,100% { box-shadow: 0 0 0 0 #ffe066cc; transform: scale(1); } 50% { box-shadow: 0 0 0 14px #ffe06600; transform: scale(1.12); } }
  .tutPulse { animation: tutPulse 0.9s ease-in-out infinite; }
  #screen button.small { font-size: 14px; min-height: 44px; padding: 6px 14px; }
  /* ---------- 2b-1: goals, bubbles, begging lines, stores ---------- */
  #meters { grid-template-columns: 1fr 1fr 1fr; }
  .chip.txt { font-size: 12px; padding: 3px 8px; }
  #goals { margin-top: 6px; font-size: 12.5px; line-height: 1.35; text-shadow: 0 1px 2px #000; max-width: 70%; }
  .goal .box { display: inline-block; width: 11px; height: 11px; border: 1.5px solid #fffc; border-radius: 3px; margin-right: 6px;
    font-size: 10px; line-height: 11px; text-align: center; vertical-align: -1px; }
  .goal.done { opacity: .6; text-decoration: line-through; }
  .goal.done .box { background: #5fd07a; border-color: #5fd07a; color: #000; }
  #bubbles { position: fixed; inset: 0; pointer-events: none; }
  /* ---------- pass: sober, whimsy gate, talking ---------- */
  #dlg { position: fixed; left: calc(var(--sl) + 10px); right: calc(var(--sr) + 10px); bottom: calc(var(--sb) + 10px); z-index: 45; max-width: 520px; margin: 0 auto;
    background: rgba(22,20,28,.94); border: 2px solid #fffc; border-radius: 18px; padding: 10px 12px 12px; color: #fff; box-shadow: 0 6px 24px #0009; }
  #dlg.hidden { display: none; }
  #dlgName { font: 800 13px system-ui; color: #ffd36b; letter-spacing: .05em; text-transform: uppercase; }
  #dlg[data-who=me] #dlgName { color: #8fd0ff; } #dlg[data-who=mad] #dlgName { color: #ff7a66; } #dlg[data-who=give] #dlgName { color: #7be08a; }
  #dlgText { font: 600 18px/1.35 system-ui; min-height: 48px; margin: 4px 0 10px; }
  #dlgOpts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dopt { min-height: 52px; border-radius: 14px; border: 2px solid #fff6; background: #ffffff22; color: #fff; font: 700 16px system-ui; padding: 6px 10px; touch-action: manipulation; }
  .dopt.first { grid-column: 1 / -1; min-height: 58px; font-size: 18px; background: #2f9e5a; border-color: #c4f5d2; }
  .dopt.dim { opacity: .75; }
  body.talking #stick, body.talking #thumbs { display: none; }
  .act.tooSober { min-height: 44px; font-size: 14px; background: #555a; border-style: dashed; }
  #minimap { position: fixed; right: calc(var(--sr) + 10px); top: calc(var(--st) + 96px); width: 92px; height: 92px; box-sizing: border-box; border-radius: 50%;
    border: 4px solid #4a5060; box-shadow: 0 0 0 3px #1a1420, 0 4px 0 3px #0005; background: #23262c; z-index: 30; touch-action: none; }
  #camReset { position: fixed; left: calc(var(--sl) + 62px); top: calc(var(--st) + 252px); width: 44px; height: 44px; z-index: 30; display: flex; align-items: center; justify-content: center; border-radius: 22px; background: #0006; }
  /* Speech bubbles: a round blob with an outline that pops in. --bb is the fill. main.ts places it (src/bubbleplace.ts)
     and sets --tail, so the tail points at the head from above (default) or from the side (.left / .right). */
  .bubble { --bb: #fffdf4; --bo: #2a1b2e; --tail: 50%; position: fixed; left: 0; top: 0; transform-origin: var(--tail) calc(100% + 10px); box-sizing: border-box;
    min-width: 56px; max-width: 164px; padding: 8px 13px 9px; border-radius: 22px; text-wrap: balance;
    background: var(--bb); color: #2a1b2e; border: 3px solid var(--bo); font-weight: 800; font-size: 14px; line-height: 1.2; text-align: center;
    box-shadow: 0 3px 0 #0005; white-space: normal; animation: bubblePop .28s cubic-bezier(.3, 1.6, .5, 1) both; }
  .bubble::before, .bubble::after { content: ''; position: absolute; left: var(--tail); border-style: solid; border-color: transparent; border-bottom: 0; }
  .bubble::before { bottom: -11px; margin-left: -9px; border-width: 10px 9px 0; border-top-color: var(--bo); }
  .bubble::after { bottom: -6px; margin-left: -6px; border-width: 7px 6px 0; border-top-color: var(--bb); }
  .bubble.left, .bubble.right { transform-origin: 50% var(--tail); }
  .bubble.left::before, .bubble.left::after, .bubble.right::before, .bubble.right::after { top: var(--tail); bottom: auto; margin-left: 0; border: solid transparent; }
  .bubble.right::before { left: -11px; margin-top: -9px; border-width: 9px 10px 9px 0; border-right-color: var(--bo); }
  .bubble.right::after { left: -6px; margin-top: -6px; border-width: 6px 7px 6px 0; border-right-color: var(--bb); }
  .bubble.left::before { left: auto; right: -11px; margin-top: -9px; border-width: 9px 0 9px 10px; border-left-color: var(--bo); }
  .bubble.left::after { left: auto; right: -6px; margin-top: -6px; border-width: 6px 0 6px 7px; border-left-color: var(--bb); }
  .bubble.me { --bb: #e3f3ff; }
  .bubble .who { display: block; font: 900 10px system-ui; letter-spacing: .06em; text-transform: uppercase; color: #7a5a2a; margin-bottom: 1px; }
  /* Build A (L165, sketch U17): optional thought bubbles around his head. Tap one, or just use the plain Ask. */
  #thinks { position: fixed; inset: 0; pointer-events: none; z-index: 34; }
  .think { position: absolute; left: 0; top: 0; width: 64px; display: flex; flex-direction: column; align-items: center; pointer-events: none; animation: bubblePop .28s cubic-bezier(.3, 1.6, .5, 1) both; }
  .think button { pointer-events: auto; width: 54px; height: 54px; border-radius: 50%; border: 3px solid #2a1b2e; background: #fffdf4; font-size: 26px; line-height: 1; padding: 0;
    box-shadow: 0 3px 0 #0005; display: flex; align-items: center; justify-content: center; }
  .think button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0005; }
  .think small { margin-top: 3px; font: 800 11px "Trebuchet MS", system-ui; color: #fff; background: #1a1420cc; padding: 1px 6px; border-radius: 7px; white-space: nowrap; }
  .think .hint { position: absolute; right: 0; top: -2px; font: 900 13px system-ui; font-style: normal; color: #ff5a8a; background: #fff; border: 2px solid #2a1b2e; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  /* Build A: the whimsy to-do list while wasted */
  #todo { position: fixed; left: calc(var(--sl) + 10px); top: calc(var(--st) + 308px); z-index: 25; pointer-events: none; background: #2a1b3ae0; border: 3px solid #1a1420; border-radius: 12px;
    padding: 5px 9px; font: 800 12px "Trebuchet MS", system-ui; color: #fff; max-width: 150px; }
  #todo.hidden { display: none; }
  #todo b { color: #ff8ae0; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
  #todo .td { display: flex; justify-content: space-between; gap: 8px; } #todo .td span { opacity: .7; font-weight: 600; }
  @media (max-height: 500px) { #todo { top: calc(var(--st) + 120px); left: calc(var(--sl) + 170px); } }
  /* Build A: the obituary card */
  .obit { background: #f4ecd8; color: #2a1b2e; border: 3px solid #1a1420; border-radius: 14px; padding: 14px 16px; max-width: 320px; width: 100%; box-sizing: border-box; text-align: left; box-shadow: 0 5px 0 #1a1420; }
  .obitHead { font: 900 13px system-ui; letter-spacing: .14em; text-transform: uppercase; color: #7a6a58; text-align: center; }
  .obitDays { font: 900 24px "Trebuchet MS", system-ui; text-align: center; margin: 2px 0 10px; }
  .obitRow { margin: 6px 0; font-size: 15px; font-weight: 600; } .obitRow b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8a7a66; }
  .obitRow.save { background: #fff6c8; border-radius: 8px; padding: 6px 8px; }
  .obitSmall { margin-top: 8px; font-size: 11px; color: #8a7a66; text-align: center; }
  .bubble.give { --bb: #fff2a8; }
  .bubble.mad { --bb: #ffd6d6; color: #6a0000; }
  @keyframes bubblePop { from { scale: .3; opacity: 0; } to { scale: 1; } }
  @media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }
  .act.line { min-height: 44px; font-size: 16px; padding: 0 14px; background: #20304acc; }
  .act.line.first { min-height: 50px; font-size: 17px; }
  .act.beg { background: linear-gradient(135deg, #3a6ad8, #2a9a8a); }
  .round.wine { background: radial-gradient(circle at 35% 30%, #ff9ab8, #a02050); }
  #shopPanel { position: fixed; left: 12px; right: 12px; top: calc(var(--st) + 70px); bottom: calc(var(--sb) + 20px); max-width: 440px; margin: 0 auto;
    background: #1d1a17f2; border: 2px solid #fff3; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }
  .shead { display: flex; justify-content: space-between; align-items: center; font-size: 20px; }
  .smoney { display: flex; gap: 4px; align-items: center; font-weight: 800; } .smoney svg { width: 18px; height: 18px; }
  .sgreet { opacity: .7; font-style: italic; }
  .slist { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; background: #fff1; border-radius: 12px; border: 1px solid #fff2; }
  .srow:active { background: #fff3; }
  .srow.poor { opacity: .45; }
  .sname { font-weight: 800; } .snote { font-size: 12px; opacity: .75; }
  .sbuy { font-weight: 900; font-size: 18px; color: #ffd84a; min-width: 40px; text-align: right; }
  .sclose { font-size: 18px; padding: 12px; border-radius: 12px; border: 0; background: #f2ede2; color: #111; font-weight: 800; }
  .hidden { display: none !important; }
  /* stats panel (2026-11-25): tap the meters */
  #meters { pointer-events: auto; cursor: pointer; }
  #statsPanel { position: fixed; inset: 0; z-index: 60; background: #0008; touch-action: pan-y; }
  #statsPanel .stbox { position: absolute; left: calc(var(--sl) + 10px); right: calc(var(--sr) + 10px); top: calc(var(--st) + 52px); max-height: calc(100% - var(--st) - var(--sb) - 70px);
    max-width: 520px; margin: 0 auto; overflow-y: auto; box-sizing: border-box; padding: 10px 12px 12px; background: #2a2633f4; border: 3px solid #1a1420;
    border-radius: 14px; box-shadow: 0 6px 0 #1a1420; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
  .sthead { display: flex; justify-content: space-between; align-items: baseline; font: 900 18px "Trebuchet MS", system-ui; text-shadow: 0 2px 0 #1a1420; }
  .sthead span { font: 700 12px "Trebuchet MS", system-ui; opacity: .7; text-shadow: none; }
  .strow { background: #ffffff10; border: 2px solid #1a1420; border-radius: 10px; padding: 7px 9px; }
  .strow.low { border-color: #ff6a6a; }
  .sttop { display: flex; align-items: center; gap: 7px; }
  .sttop .ic { width: 22px; height: 22px; flex: none; } .sttop .ic svg { width: 22px; height: 22px; }
  .sttop b { font-size: 16px; min-width: 88px; }
  .sttop .track { flex: 1; height: 12px; background: #2a2633; border: 2px solid #1a1420; border-radius: 4px; overflow: hidden; }
  .sttop .fill { height: 100%; border-radius: 2px; }
  .stnum { font: 900 16px ui-monospace, monospace; min-width: 30px; text-align: right; }
  .sttrend { font-size: 12px; font-weight: 800; margin: 3px 0 2px 29px; opacity: .85; }
  .sttrend.rising { color: #8be07a; } .sttrend.falling { color: #ff9a8a; }
  .stexp { font-size: 13.5px; line-height: 1.35; margin-left: 29px; opacity: .92; }

  /* ---------- polish pass: UI kit (U05/U15): slate, thick dark outline, chunky gold/green, hard pixel edges ---------- */
  :root { --ink: #1a1420; --slate: #3b3646; --slate2: #2a2633; --gold: #f2c14e; --gold2: #b27a22; --green: #5bb544; --orange: #f08a2c; }
  html, body { font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif; -webkit-font-smoothing: none; }
