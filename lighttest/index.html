<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#111" />
<title>Lighting test</title>
<style>
  :root { --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #f4f0e8;
    font: 14px/1.3 -apple-system, system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; image-rendering: pixelated; }
  #info { position: fixed; top: calc(var(--st) + 8px); left: calc(var(--sl) + 8px); right: calc(var(--sr) + 8px); pointer-events: none;
    background: #000a; border-radius: 10px; padding: 8px 10px; font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; max-width: 560px; }
  #info b { font: 700 16px/1.3 -apple-system, system-ui, sans-serif; color: #ffd04a; }
  #bar { position: fixed; left: calc(var(--sl) + 8px); right: calc(var(--sr) + 8px); bottom: calc(var(--sb) + 10px); display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #bar button { min-width: 56px; min-height: 52px; padding: 0 14px; border-radius: 12px; border: 2px solid #fff5; background: #2a2236e6; color: #fff;
    font: 800 18px/1 -apple-system, system-ui, sans-serif; }
  #bar button.on { background: #ffb84a; color: #1a1420; border-color: #ffe0a0; }
  #bar button.walk { font-size: 15px; }
  #busy { position: fixed; inset: 0; display: grid; place-items: center; font: 600 16px -apple-system, system-ui, sans-serif; pointer-events: none; }
</style>

</head>
